# fly launch --no-deploy   (then: fly volumes create data --region bom --size 1)
# fly secrets set BPD_PUBLIC_URL=https://<app>.fly.dev BPD_TIP_UPI=you@okaxis   (crypto, optional: BPD_SOLANA_CLUSTER, BPD_SOLANA_RPC)
# fly deploy
app = "bhai-paise-de"
primary_region = "bom"   # Mumbai

[build]

[env]
  NODE_ENV = "production"
  BPD_DATA_DIR = "/data"
  PORT = "8787"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"     # the payment watcher must keep running
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 800
    hard_limit = 1500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
