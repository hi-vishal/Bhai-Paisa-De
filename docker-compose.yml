# One VPS, real HTTPS, nightly-free continuous backups.
#   DOMAIN=paise.example.com docker compose up -d
# Caddy gets a Let's Encrypt certificate for $DOMAIN automatically (point the DNS A record at this box first).

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BPD_DATA_DIR: /data
      PORT: 8787
    volumes:
      - data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. paise.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app

  # Streams every SQLite change to S3/R2/B2 within a second. Restore: see README.md → "Backups".
  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    profiles: ["backup"]
    command: replicate
    env_file: .env
    volumes:
      - data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

volumes:
  data:
  caddy:
